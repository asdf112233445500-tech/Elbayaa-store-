name: Build ELBAYAA Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Flutter local.properties
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Gradle wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin
          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          echo "Gradle wrapper ready"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Remove test directory
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: cd android && ./gradlew assembleRelease && cd .. && mkdir -p build/app/outputs/flutter-apk && cp android/app/build/outputs/apk/release/app-release.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Diagnose build outputs
        if: always()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print
          echo "=== App outputs ==="
          find build android/app/build -maxdepth 6 -type f 2>/dev/null | head -200

      - name: Verify APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          test -s "$APK"
          echo "APK generated: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELBAYAA-Store-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
