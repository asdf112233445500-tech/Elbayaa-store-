name: Build ELBAYAA Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.elbayaa --project-name store .
          sed -i 's/id "com.android.application" version "[^"]*" apply false/id "com.android.application" version "8.9.1" apply false/' android/settings.gradle
          sed -i "s/applicationId = 'com.elbayaa.store'/applicationId = 'com.elbayaa.store'/" android/app/build.gradle
          echo "--- Android files ---"
          find android -maxdepth 4 -type f | sort
          echo "--- Gradle wrapper ---"
          ls -la android/gradle/wrapper

      - name: Remove generated test
        run: rm -rf test

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --verbose

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find build -type f -name "*.apk" -print
          APK=$(find build -type f -name "app-release.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/ELBAYAA-Store.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELBAYAA-Store-APK
          path: artifacts/ELBAYAA-Store.apk
          if-no-files-found: error
