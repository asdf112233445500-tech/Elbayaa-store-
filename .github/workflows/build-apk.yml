name: Build ELBAYAA Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Restore Flutter Gradle wrapper
        run: |
          rm -rf /tmp/flutter_android_wrapper
          flutter create --platforms=android /tmp/flutter_android_wrapper
          mkdir -p android/gradle/wrapper
          cp /tmp/flutter_android_wrapper/android/gradlew android/gradlew
          cp /tmp/flutter_android_wrapper/android/gradlew.bat android/gradlew.bat
          cp -R /tmp/flutter_android_wrapper/android/gradle/wrapper/. android/gradle/wrapper/
          chmod +x android/gradlew
          ls -la android/gradle/wrapper

      - name: Remove generated test
        run: rm -rf test

      - name: Clean project
        run: |
          flutter clean
          rm -rf build
          rm -rf android/.gradle
          rm -rf android/app/build

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

          APK=$(find build -type f -name "app-release.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK found: $APK"
          mkdir -p artifacts
          cp "$APK" artifacts/ELBAYAA-Store.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELBAYAA-Store-APK
          path: artifacts/ELBAYAA-Store.apk
          if-no-files-found: error
