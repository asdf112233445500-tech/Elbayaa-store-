name: Build ELBAYAA Store APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      # The uploaded project intentionally keeps Android source files,
      # but Flutter regenerates the Gradle wrapper on CI if it is absent.
      - name: Repair Android project / Gradle wrapper
        run: flutter create --platforms=android --org com.elbayaa --project-name elbayaa .

      - name: Remove generated Flutter test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get


      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELBAYAA-Store-APK
          path: build/app/outputs/flutter-apk/app-release.apk
